<style>
/* CSS Moderno com Cores Nativas do Prosilver */
.checkout-container {
    max-width: 550px;
    margin: 30px auto;
    background: #f9f9f9; /* Padrão bg1 do Prosilver */
    border: 1px solid #cccccc;
    border-radius: 8px;
    box-shadow: 0 4px 15px rgba(0,0,0,0.1);
    overflow: hidden;
}

/* Barra de Passos (Progress Bar) */
.checkout-steps {
    display: flex;
    justify-content: space-between;
    align-items: center;
    padding: 20px 30px;
    background: #f0f0f0; /* Padrão bg2 do Prosilver */
    border-bottom: 1px solid #cccccc;
    position: relative;
}

.checkout-steps::before {
    content: '';
    position: absolute;
    top: 35px;
    left: 45px;
    right: 45px;
    height: 3px;
    background: #cccccc;
    z-index: 1;
}

.step-item {
    position: relative;
    z-index: 2;
    display: flex;
    flex-direction: column;
    align-items: center;
    text-align: center;
}

.step-circle {
    width: 32px;
    height: 32px;
    border-radius: 50%;
    background: #ffffff;
    border: 3px solid #cccccc;
    color: #666666;
    display: flex;
    align-items: center;
    justify-content: center;
    font-weight: bold;
    font-size: 14px;
    margin-bottom: 8px;
}

.step-item.active .step-circle {
    border-color: #12A3EB; /* Azul do Prosilver */
    background: #12A3EB;
    color: #fff;
}

.step-item.completed .step-circle {
    border-color: #228822; /* Verde de sucesso nativo */
    background: #228822;
    color: #fff;
}

.step-label {
    font-size: 11px;
    font-weight: bold;
    color: #666666;
    text-transform: uppercase;
}

.step-item.active .step-label {
    color: #12A3EB;
}

.checkout-header {
    padding: 25px 20px 15px;
    text-align: center;
}

.checkout-amount {
    font-size: 36px;
    font-weight: 800;
    color: #333333;
    margin: 0;
    line-height: 1;
}

.checkout-desc {
    color: #666666;
    font-size: 15px;
    margin-top: 8px;
}

.checkout-body {
    padding: 0 25px 25px;
}

.checkout-title {
    font-size: 12px;
    text-transform: uppercase;
    color: #666666;
    font-weight: bold;
    margin-bottom: 15px;
    text-align: center;
}

/* Opções de Gateways */
.gateway-option {
    display: flex;
    align-items: center;
    padding: 18px 15px;
    border: 2px solid #cccccc;
    border-radius: 6px;
    margin-bottom: 12px;
    cursor: pointer;
    transition: all 0.2s ease;
    background: #ffffff;
}

.gateway-option:hover {
    border-color: #12A3EB;
    background: #f4faff;
}

.gateway-option input[type="radio"] {
    margin-right: 15px;
    cursor: pointer;
}

.gateway-icon {
    font-size: 28px;
    margin-right: 15px;
    width: 35px;
    text-align: center;
}

.gateway-name {
    font-size: 16px;
    font-weight: bold;
    color: #333333;
    display: block;
}

.gateway-sub {
    font-size: 12px;
    color: #666666;
    display: block;
    margin-top: 3px;
}

.checkout-secure {
    text-align: center;
    font-size: 11px;
    color: #666666;
    margin-top: 18px;
}
</style>

<div class="checkout-container">
    <!-- Barra de Passos -->
    <div class="checkout-steps">
        <div class="step-item completed">
            <div class="step-circle">✓</div>
            <div class="step-label">{STEP1_LABEL}</div>
        </div>
        <div class="step-item active">
            <div class="step-circle">2</div>
            <div class="step-label">Pagamento</div>
        </div>
        <div class="step-item">
            <div class="step-circle">3</div>
            <div class="step-label">Conclusão</div>
        </div>
    </div>

    <div class="checkout-header">
        <p class="checkout-desc" style="margin-bottom: 8px;">Total a pagar</p>
        <h1 class="checkout-amount">{INTENT_CURRENCY} {INTENT_AMOUNT}</h1>
        <p class="checkout-desc"><strong>{INTENT_DESCRIPTION}</strong></p>
        <!-- IF INTENT_REWARD_INFO -->
        <p style="margin-top: 6px; margin-bottom: 0; font-size: 14px; font-weight: bold; color: #115098;">
            {INTENT_REWARD_INFO}
        </p>
        <!-- ENDIF -->
    </div>

    <div class="checkout-body">
        <!-- IF CHECKOUT_ERROR -->
            <div class="errorbox" style="margin-bottom: 15px;">
                <p><strong>Erro:</strong> {CHECKOUT_ERROR}</p>
            </div>
        <!-- ENDIF -->

        <form method="post" action="{U_ACTION}">
            <!-- IF HAS_GATEWAYS -->
                <div class="checkout-title">Escolha a forma de pagamento</div>
                
                <!-- BEGIN gateways -->
                <label class="gateway-option">
                    <input type="radio" name="gateway" value="{gateways.ID}" <!-- IF gateways.S_FIRST_ROW -->checked="checked"<!-- ENDIF -->>
                    
                    <div class="gateway-icon">
                        <!-- IF gateways.ID == 'stripe' -->
                            <i class="icon fa-cc-stripe fa-fw" aria-hidden="true" style="color: #6772E5;"></i>
                        <!-- ELSEIF gateways.ID == 'paypal' -->
                            <i class="icon fa-paypal fa-fw" aria-hidden="true" style="color: #00457C;"></i>
                        <!-- ELSEIF gateways.ID == 'btcpay' or gateways.ID == 'coinpayments' -->
                            <i class="icon fa-btc fa-fw" aria-hidden="true" style="color: #F7931A;"></i>
                        <!-- ELSEIF gateways.ID == 'mercadopago' -->
                            <i class="icon fa-handshake-o fa-fw" aria-hidden="true" style="color: #009EE3;"></i>
                        <!-- ELSE -->
                            <i class="icon fa-credit-card fa-fw" aria-hidden="true" style="color: #666666;"></i>
                        <!-- ENDIF -->
                    </div>

                    <div>
                        <span class="gateway-name">{gateways.NAME}</span>
                        <!-- IF gateways.ID == 'stripe' -->
                            <span class="gateway-sub">Cartões de Crédito (Visa, Master, etc)</span>
                        <!-- ELSEIF gateways.ID == 'mercadopago' -->
                            <span class="gateway-sub">Pague com Pix, Boleto ou Cartão</span>
                        <!-- ELSEIF gateways.ID == 'paypal' -->
                            <span class="gateway-sub">Pague com segurança via PayPal</span>
                        <!-- ELSEIF gateways.ID == 'btcpay' or gateways.ID == 'coinpayments' -->
                            <span class="gateway-sub">Bitcoin e Altcoins processado via Cripto</span>
                        <!-- ELSE -->
                            <span class="gateway-sub">Processamento seguro criptografado</span>
                        <!-- ENDIF -->
                    </div>
                </label>
                <!-- END gateways -->

                <fieldset class="submit-buttons" style="margin-top: 15px; text-align: center;">
                    <input type="submit" name="submit" value="Finalizar Pagamento" class="button1" style="font-size: 16px; padding: 10px 30px; text-transform: uppercase; width: 100%; border-radius: 6px;" />
                </fieldset>
                
                <div class="checkout-secure">
                    🔒 Ambiente 100% Seguro e Criptografado
                </div>
            <!-- ELSE -->
                <div class="errorbox">
                    <p>Nenhuma forma de pagamento está disponível no momento.</p>
                </div>
            <!-- ENDIF -->
            {S_FORM_TOKEN}
        </form>
    </div>
</div>

<!-- INCLUDE overall_footer.html -->
